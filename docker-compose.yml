services:
  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: elearning_db
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpassword
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - elearning-network
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/elearning_db
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpassword
    networks:
      - elearning-network

  bff-elearning:
    build:
      context: ./bff-elearning
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - course-service
    environment:
      SERVICES_COURSE_SERVICE_URL: http://course-service:8080/api/courses
    networks:
      - elearning-network

  angular-app:
    build:
      context: ./angular-app
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - bff-elearning
    networks:
      - elearning-network

networks:
  elearning-network:
    driver: bridge
